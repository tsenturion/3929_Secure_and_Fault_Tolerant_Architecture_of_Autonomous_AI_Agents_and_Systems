[SERVICE]
    Flush          1
    Log_Level      warn
    Parsers_File   /fluent-bit/etc/dispatcher-parsers.conf
    storage.path   /state/chunks

[INPUT]
    Name                 tail
    Tag                  dispatcher
    Path                 /inputs/*/*.log
    Parser               dispatcher_json
    DB                   /state/tail.db
    DB.Sync              Normal
    Read_from_Head       On
    Refresh_Interval     2
    Skip_Long_Lines      On
    Buffer_Chunk_Size    16k
    Buffer_Max_Size      32k
    storage.type         filesystem

[FILTER]
    Name                 grep
    Match                dispatcher
    Regex                service ^(dispatcher|executor|model-gateway|audit-witness|runbook-agent|monitoring|runbook-catalog)$

[OUTPUT]
    Name                     loki
    Match                    dispatcher
    Host                     loki
    Port                     3100
    Labels                   app=dispatcher,service=$service
    Line_Format              json
    Retry_Limit              False
    storage.total_limit_size 64M
