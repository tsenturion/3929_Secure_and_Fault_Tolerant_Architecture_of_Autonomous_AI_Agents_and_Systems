x-tpm: &tpm
  profiles: [tpm]
  build:
    context: .
    target: tpm
  image: incident-dispatcher-tpm:local
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m

services:
  agent:
    environment:
      SERVICE_AUTH_MODE: certificate
      EXECUTOR_URL: https://executor:8443
      WORKLOAD_TLS_DIR: /run/identity
      TPM_SIGNER_URL: ${TPM_SIGNER_URL:-}
    volumes:
      - type: bind
        source: ./certs/agent-identity/agent
        target: /run/identity
        read_only: true
        bind:
          create_host_path: false
    networks: [tpm-signing]
    depends_on:
      executor-tls:
        condition: service_healthy

  executor:
    command: ["dispatcher.executor:app", "--host", "127.0.0.1", "--port", "8001", "--no-proxy-headers", "--no-access-log"]
    environment:
      SERVICE_AUTH_MODE: certificate
      SERVICE_TOKEN: ""
      TPM_PUBLIC_KEY: /app/tpm-trust/agent.pem
    volumes:
      - tpm-trust:/app/tpm-trust:ro

  executor-tls:
    image: nginxinc/nginx-unprivileged:stable-alpine
    network_mode: service:executor
    depends_on:
      executor:
        condition: service_healthy
        restart: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes:
      - ./deploy/workload_identity/docker/executor-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ./certs/agent-identity/executor
        target: /run/identity
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "test -s /tmp/nginx.pid && nginx -t -q"]
      interval: 5s
      timeout: 3s
      retries: 10

  tpm-init:
    <<: *tpm
    entrypoint: ["/app/.venv/bin/python", "-m", "dispatcher.identity.workload_identity.tpm"]
    network_mode: none
    volumes:
      - tpm-state:/app/tpm-state
      - tpm-trust:/app/tpm-trust
      - tpm-logs:/app/logs

  tpm-signer:
    <<: *tpm
    command: ["dispatcher.identity.workload_identity.tpm_signer:app", "--host", "0.0.0.0", "--port", "8003", "--no-access-log"]
    depends_on:
      tpm-init:
        condition: service_completed_successfully
    networks: [tpm-signing]
    volumes:
      - tpm-state:/app/tpm-state
      - tpm-logs:/app/logs
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  tpm-signing:
    internal: true

volumes:
  tpm-state:
  tpm-trust:
  tpm-logs:
