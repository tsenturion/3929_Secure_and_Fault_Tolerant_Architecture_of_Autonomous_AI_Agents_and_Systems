[project]
name = "incident-dispatcher"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "httpx2",
    "psycopg[binary]>=3.3.9",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn",
]

[project.optional-dependencies]
qwen = ["torch", "transformers"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
