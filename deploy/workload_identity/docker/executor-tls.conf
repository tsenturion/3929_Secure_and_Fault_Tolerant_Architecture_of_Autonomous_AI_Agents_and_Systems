server {
    listen 8443 ssl;
    server_name executor;
    ssl_certificate /run/identity/tls.pem;
    ssl_certificate_key /run/identity/tls.pem;
    ssl_client_certificate /run/identity/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 64k;
    error_page 495 496 = @client_certificate_required;

    location @client_certificate_required {
        default_type application/json;
        add_header X-Policy-Code certificate_required always;
        return 401 '{"detail":"Требуется доверенный клиентский сертификат."}';
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Verified-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Service-Token "";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 150s;
    }
}
